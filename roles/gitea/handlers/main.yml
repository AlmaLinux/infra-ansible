---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Gitea
  ansible.builtin.systemd_service:
    name: gitea
    state: restarted

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: reloaded

- name: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: restarted
