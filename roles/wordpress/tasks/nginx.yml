---
- name: Install nginx and brotli module
  ansible.builtin.dnf:
    name:
      - nginx
      - nginx-mod-brotli
    state: present
  tags:
    - nginx

- name: Gather package facts for nginx version check
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - nginx

- name: Distribute /etc/nginx/nginx.conf
  ansible.builtin.template:
    src: nginx/nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags:
    - nginx

- name: Distribute wordpress vhost configuration
  ansible.builtin.template:
    src: nginx/wordpress.conf.j2
    dest: /etc/nginx/conf.d/{{ wordpress_hostname }}.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags:
    - nginx

- name: Remove default nginx site configuration
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx
  tags:
    - nginx

- name: Start/enable nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: started
    enabled: true
  tags:
    - nginx
