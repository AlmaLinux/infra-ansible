---
- name: Route53 tasks
  ansible.builtin.include_tasks: route53.yml
  when: wordpress_certbot_auth == 'dns_route53'
  tags: certbot

- name: Install certbot
  ansible.builtin.package:
    name:
      - certbot
    state: present
  tags: certbot

- name: Install certbot Route53 plugin
  ansible.builtin.package:
    name:
      - python3-certbot-dns-route53
    state: present
  when: wordpress_certbot_auth == 'dns_route53'
  tags: certbot

- name: Install certbot Cloudflare plugin
  ansible.builtin.package:
    name:
      - python3-certbot-dns-cloudflare
    state: present
  when: wordpress_certbot_auth == 'dns_cloudflare'
  tags: certbot

- name: Ensure Let's Encrypt directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    mode: "0700"
  tags: certbot

- name: Cloudflare credentials
  ansible.builtin.include_tasks: cloudflare.yml
  when: wordpress_certbot_auth == 'dns_cloudflare'
  tags: certbot

- name: Create ACME webroot directory
  ansible.builtin.file:
    path: /var/lib/letsencrypt/.well-known/acme-challenge
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: certbot

- name: Start/enable certbot renew timer
  ansible.builtin.systemd_service:
    name: certbot-renew.timer
    state: started
    enabled: true
  tags: certbot

- name: Configure certbot deploy hook
  ansible.builtin.template:
    src: certbot-deploy-hook.sh.j2
    dest: /etc/letsencrypt/deploy-nginx.sh
    mode: "0755"
  tags: certbot

- name: Create self-signed certificate directory
  ansible.builtin.file:
    path: /etc/pki/nginx/{{ wordpress_hostname }}
    state: directory
    mode: "0700"
  tags: certbot

- name: Generate self-signed certificate for initial nginx startup # noqa no-changed-when
  # nginx will not start on a TLS vhost whose certificate is missing, and
  # certbot's http-01 challenge needs nginx up, so the first deploy serves this
  # until there is a real one.
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /etc/pki/nginx/{{ wordpress_hostname }}/privkey.pem
      -out /etc/pki/nginx/{{ wordpress_hostname }}/fullchain.pem
      -subj '/CN={{ wordpress_hostname }}'
    creates: /etc/pki/nginx/{{ wordpress_hostname }}/fullchain.pem
  tags: certbot

- name: Install the certificate retry units
  # http-01 only: it needs DNS pointing at this host, which can come after the
  # first deploy. The DNS methods need nothing here and fail the deploy instead.
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - wordpress-certbot.service
    - wordpress-certbot.timer
  when: wordpress_certbot_auth == 'http'
  tags: certbot

- name: Retry the certificate hourly until certbot has it
  ansible.builtin.systemd_service:
    name: wordpress-certbot.timer
    state: started
    enabled: true
    daemon_reload: true
  when: wordpress_certbot_auth == 'http'
  tags: certbot

- name: Check for existing certbot renewal config (DNS pre-fetch)
  ansible.builtin.stat:
    path: /etc/letsencrypt/renewal/{{ wordpress_hostname }}.conf
  register: wordpress_certbot_dns_check
  tags: certbot

- name: Obtain DNS-auth certificate before nginx startup # noqa no-changed-when
  # DNS validation needs nothing listening, so it can run before nginx exists.
  # http-01 cannot, and is done in certbot-obtain.yml once nginx is serving.
  ansible.builtin.shell: >
    certbot certonly
    {% if wordpress_certbot_auth == 'dns_route53' %}
    --dns-route53
    {% elif wordpress_certbot_auth == 'dns_cloudflare' %}
    --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
    --dns-cloudflare-propagation-seconds {{ wordpress_cloudflare_propagation_seconds }}
    {% endif %}
    --cert-name {{ wordpress_hostname }}
    -d {{ wordpress_hostname }}
    {% for domain in wordpress_extra_domains %}
    -d {{ domain }}
    {% endfor %}
    -m {{ certbot_email }} --agree-tos -n
    --deploy-hook /etc/letsencrypt/deploy-nginx.sh
  when:
    - not wordpress_certbot_dns_check.stat.exists
    - wordpress_certbot_auth != 'http'
  tags: certbot
