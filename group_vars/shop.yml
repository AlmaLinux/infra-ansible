---
firewalld_extra_allow_ports:
  - "22/tcp"
  - "80/tcp"
  - "443/tcp"

wordpress_hostname: shop.almalinux.org
wordpress_woocommerce: true
wordpress_object_cache: true

# Only used by the first deploy, to create the site. After that the admin
# account is WordPress's to manage, and the vault value is just the original.
wordpress_site_title: AlmaLinux Shop
wordpress_admin_user: infra
wordpress_admin_email: infra-team@almalinux.org
wordpress_admin_password:
  "{{ lookup('community.hashi_vault.hashi_vault', 'kv/data/infra/shop:wordpress_admin_password',
  token=lookup('env', 'VAULT_TOKEN'), url=secrets_url) }}"

# Sign-in with AlmaLinux ID; anyone with an account may sign in. The secret
# belongs to the `shop` client in Keycloak. Staff are promoted in wp-admin.
wordpress_oidc_issuer: https://id.almalinux.org/realms/master
wordpress_oidc_client_id: shop
wordpress_oidc_client_secret:
  "{{ lookup('community.hashi_vault.hashi_vault', 'kv/data/infra/shop:oidc_client_secret',
  token=lookup('env', 'VAULT_TOKEN'), url=secrets_url) }}"

# Database: the server is geerlingguy.mysql's, the credentials are the app's.
# That role defaults mysql_hide_passwords to false, which prints the root
# password and every user password in the task output of an ordinary run.
mysql_hide_passwords: true
mysql_root_password:
  "{{ lookup('community.hashi_vault.hashi_vault', 'kv/data/infra/shop:mysql_root_password',
  token=lookup('env', 'VAULT_TOKEN'), url=secrets_url) }}"
mysql_databases:
  - name: wordpress
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
mysql_users:
  - name: wordpress
    host: 127.0.0.1
    password:
      "{{ lookup('community.hashi_vault.hashi_vault', 'kv/data/infra/shop:mysql_wordpress_user_password',
      token=lookup('env', 'VAULT_TOKEN'), url=secrets_url) }}"
    priv: wordpress.*:ALL
mysql_bind_address: '127.0.0.1'
mysql_skip_name_resolve: true
# A shop's whole dataset fits in this; raise it with the host
mysql_innodb_buffer_pool_size: "512M"
mysql_query_cache_size: "0"
mysql_key_buffer_size: "0"

wordpress_db_password:
  "{{ lookup('community.hashi_vault.hashi_vault', 'kv/data/infra/shop:mysql_wordpress_user_password',
  token=lookup('env', 'VAULT_TOKEN'), url=secrets_url) }}"
